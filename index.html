<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Library Management System</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 900px;
            background: white;
            border-radius: 20px;
            padding: 50px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
        }

        h1 {
            color: #333;
            margin-bottom: 15px;
        }

        p {
            color: #666;
            margin-bottom: 30px;
            font-size: 17px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        a {
            text-decoration: none;
            padding: 14px 30px;
            border-radius: 10px;
            color: white;
            background: #667eea;
            transition: 0.3s;
        }

        a:hover {
            transform: translateY(-3px);
            background: #5568d8;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>📚 Library Management System</h1>

        <p>
            Manage students, books and book transactions
            through a simple library management system.
        </p>

        <div class="buttons">
            <a href="login.html">Login</a>
            <a href="studentRegistration">Student Registration</a>
            
        </div>

    </div>

</body>
</html>
