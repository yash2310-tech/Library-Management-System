<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Add Student</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 450px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #444;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #667eea;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #667eea;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>👨‍🎓 Add Student</h1>

    <p class="subtitle">
        Enter student details
    </p>

    <form action="addStudent" method="post">

        <label>Student Name</label>
        <input type="text"
               name="name"
               placeholder="Enter student name"
               required>

        <label>Roll Number</label>
        <input type="text"
               name="roll_no"
               placeholder="Enter roll number"
               required>

        <label>Email</label>
        <input type="email"
               name="email"
               placeholder="Enter email"
               required>

        <button type="submit">
            ➕ Add Student
        </button>

    </form>

    <a href="dashboard.html" class="back">
        ← Back to Dashboard
    </a>

</div>

</body>
</html>
